<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>html,body{margin:0;padding:0}</style></head><body><title>Гольф-клуб «Знаменский»</title>
<meta name="theme-color" content="#1B4D2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--bg:#F6F3EA;--surface:#FFFFFF;--surface2:#EFEBDD;--ink:#17261C;--ink2:#47564B;--muted:#6F7B70;--line:#DDD7C4;--brand:#1B4D2E;--on-brand:#FFFFFF;--brand-soft:#E1EBDD;--gold:#D4A054;--gold-ink:#85591A;--gold-soft:#F5E8CE;--on-gold:#2A1D07;--ok:#2F7A4B;--warn:#B4531A;--bad:#A33A2A;--bad-soft:#F6DEDA;--warn-soft:#F7E3D2;--hero:#1B4D2E;--hero-ink:#F6F2E3;--f-display:"Playfair Display",Georgia,"Times New Roman",serif;--f-text:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1B13;--surface:#15271C;--surface2:#1C3225;--ink:#EFF1E7;--ink2:#BAC5B7;--muted:#8A9687;--line:#2B4331;--brand:#5FA777;--on-brand:#0B1A11;--brand-soft:#1E3A2A;--gold:#D4A054;--gold-ink:#E3B86F;--gold-soft:#3A2E17;--on-gold:#241906;--ok:#6CC08A;--warn:#E58A4F;--bad:#EE8B7C;--bad-soft:#3D1E1A;--warn-soft:#3B2616;--hero:#1B4D2E;--hero-ink:#F6F2E3;color-scheme:dark}}:root[data-theme="dark"]{--bg:#0E1B13;--surface:#15271C;--surface2:#1C3225;--ink:#EFF1E7;--ink2:#BAC5B7;--muted:#8A9687;--line:#2B4331;--brand:#5FA777;--on-brand:#0B1A11;--brand-soft:#1E3A2A;--gold:#D4A054;--gold-ink:#E3B86F;--gold-soft:#3A2E17;--on-gold:#241906;--ok:#6CC08A;--warn:#E58A4F;--bad:#EE8B7C;--bad-soft:#3D1E1A;--warn-soft:#3B2616;--hero:#1B4D2E;--hero-ink:#F6F2E3;color-scheme:dark}
[hidden]{display:none!important}
:where(svg:not([width])){width:20px;height:20px;flex:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-text);padding-inline:16px;padding-block:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:680px;margin-inline:auto;min-width:0}
.wrap.wide{max-width:1080px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

/* шапка и навигация */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:none;width:38px;height:38px;border-radius:11px;background:var(--hero);display:grid;place-items:center}
.brand b{display:block;font:700 19px/1.1 var(--f-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ico-btn svg{width:22px;height:22px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;width:100%;max-width:680px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:12px;font-weight:500;min-height:54px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft);font-weight:600}
main{padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}

/* типографика */
.h1{font:700 30px/1.12 var(--f-display);letter-spacing:.005em;text-wrap:balance}
.h2{font:700 22px/1.2 var(--f-display);text-wrap:balance}
.h3{font:600 12px/1.2 var(--f-text);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--ink2);font-size:16px;text-wrap:pretty}
.small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card.flat{background:var(--surface2);border-color:transparent}
.card.gold{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.hr{height:1px;background:var(--line);border:0;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* герой */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--hero);color:var(--hero-ink);padding:22px 20px 20px}
.hero svg.contours{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.hero>*{position:relative}
.hero .h1{color:var(--hero-ink)}
.hero p{color:color-mix(in srgb,var(--hero-ink) 82%,transparent);margin-top:6px}
.hero .gold-line{color:var(--gold);font:600 12px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}

/* варианты выбора */
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-height:72px}
.opt:active{transform:scale(.995)}
.opt .oi{flex:none;width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.opt .oi svg{width:26px;height:26px}
.opt b{display:block;font-weight:600;font-size:17px;line-height:1.2}
.opt small{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.opt .chev{flex:none;color:var(--muted);width:20px;height:20px}
.opt.hero-opt{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.opt.hero-opt .oi{background:var(--gold);color:var(--on-gold)}
.opt .tag{margin-left:auto}

/* значки */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.badge.free{background:var(--brand-soft);color:var(--brand)}
.badge.gold{background:var(--gold-soft);color:var(--gold-ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge svg{width:13px;height:13px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* форма */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.in{width:100%;min-height:50px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:17px;color:var(--ink)}
.in::placeholder{color:var(--muted);opacity:1}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 55%,calc(100% - 16px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.in.sm{min-height:40px;font-size:15px;padding:6px 10px;border-radius:10px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.okbox{background:var(--brand-soft);color:var(--brand);border-radius:14px;padding:12px 14px;font-size:14px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;border-left:3px solid var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip.sm{min-height:36px;padding:0 12px;font-size:14px}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:14px;background:var(--surface2)}
.seg button{min-height:40px;padding:0 14px;border:0;background:none;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.step button{width:48px;height:48px;border:0;background:none;font-size:24px;line-height:1;color:var(--brand);font-weight:500}
.step button[disabled]{opacity:.3}
.step output{min-width:44px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.step.sm button{width:38px;height:38px;font-size:20px}.step.sm output{min-width:32px;font-size:16px}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--brand)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--gold);outline-offset:2px}

/* даты и время */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:start;width:60px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.day small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day b{font:700 22px/1.1 var(--f-text)}
.day em{font-style:normal;font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:color-mix(in srgb,var(--on-brand) 80%,transparent)}
.day[disabled]{opacity:.4}
.day i{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:2px}
.day[disabled] i{background:var(--line)}
.quick{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.q b{font-size:17px}.q small{display:block;color:var(--muted);font-size:13px}
.q[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:500 16px var(--f-mono)}
.t[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.t[disabled]{opacity:.45;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);border-style:dashed}
.pips{display:flex;gap:3px}.pips i{width:8px;height:8px;border-radius:2px;border:1px solid currentColor;opacity:.55}.pips i.on{background:currentColor;opacity:.9}
.hh{font-size:12px;color:var(--muted);margin:6px 0 -2px}

/* цена */
.price{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.pl .free{color:var(--ok);font-weight:600}
.pl small{display:block;color:var(--muted);font-size:12px}
.pl.tot{padding-top:8px;border-top:1px dashed var(--line);font-weight:700;font-size:19px}
.cta{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;padding:10px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.cta-in{max-width:680px;margin-inline:auto;display:flex;align-items:center;gap:14px}
.cta-in .sum{flex:1;min-width:0}
.cta-in .sum b{display:block;font-size:20px;line-height:1.1}.cta-in .sum small{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta-in .btn{min-width:150px}
.pad-cta{height:70px}

/* кошелёк */
.wal{display:flex;flex-direction:column;gap:10px;border-radius:18px;padding:14px 16px;background:var(--hero);color:var(--hero-ink)}
.wal .h3{color:var(--gold)}
.wal b{font:700 20px/1.2 var(--f-display)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);display:block}
.dots i.on{background:var(--gold)}
.wal small{color:color-mix(in srgb,var(--hero-ink) 75%,transparent)}
.wal .btn{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* сертификат */
.cert{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;background:var(--hero);color:var(--hero-ink);border:2px solid var(--gold);outline:1px solid color-mix(in srgb,var(--gold) 55%,transparent);outline-offset:-9px}
.cert svg.contours{position:absolute;inset:0;width:100%;height:100%;opacity:.14;pointer-events:none}
.cert>*{position:relative}
.cert .k{font:600 11px/1 var(--f-text);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cert .t1{font:700 28px/1.1 var(--f-display);margin:10px 0 6px}
.cert .code{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.1);border:1px dashed var(--gold);font:500 20px var(--f-mono);letter-spacing:.08em}
.cert small{display:block;color:color-mix(in srgb,var(--hero-ink) 75%,transparent);margin-top:8px}

/* таблицы персонала */
.tbl-wrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .c{text-align:center}
.tbl input.sc{width:44px;min-height:38px;text-align:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0;font-size:16px}
.nav2{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:0 16px 4px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.nav2::-webkit-scrollbar{display:none}
.nav2 button{flex:none;min-height:46px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;font-size:15px;color:var(--ink2)}
.nav2 button[aria-current="page"]{border-bottom-color:var(--gold);color:var(--ink)}
.sheetrow{display:grid;grid-template-columns:56px 82px 1fr;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px;min-height:46px}
.sheetrow:last-child{border-bottom:0}
.sheetrow.free{color:var(--muted)}
.sheetrow.closed{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface2) 6px 7px);color:var(--muted)}

/* игра */
.holes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.holes::-webkit-scrollbar{display:none}
.hd{flex:none;width:44px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
.hd small{font-size:11px;font-weight:500;color:var(--muted)}
.hd.done{background:var(--brand-soft);border-color:transparent}
.hd[aria-current="true"]{border:2px solid var(--gold);background:var(--gold-soft)}
.holeinfo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.holeinfo .n{font:700 56px/1 var(--f-display)}
.holeinfo div b{display:block;font-size:18px}
.pc{display:flex;flex-direction:column;gap:12px}
.pc-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.recv{display:inline-flex;gap:3px}.recv i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.big{display:flex;align-items:center;justify-content:center;gap:14px}
.big button.pm{width:68px;height:68px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:34px;color:var(--brand);line-height:1}
.big output{min-width:84px;text-align:center;font:700 56px/1 var(--f-display)}
.big output small{display:block;font:500 13px var(--f-text);color:var(--muted);margin-top:4px}
.quickscore{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.res-birdie{color:var(--ok)}.res-bogey{color:var(--warn)}.res-dbl{color:var(--bad)}
.sc-cell{display:inline-grid;place-items:center;width:30px;height:30px;font-weight:600;font-variant-numeric:tabular-nums}
.sc-cell.birdie{border:1.5px solid var(--ok);border-radius:50%}
.sc-cell.eagle{border:1.5px solid var(--ok);border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ok)}
.sc-cell.bogey{border:1.5px solid var(--warn);border-radius:4px}
.sc-cell.dbl{border:1.5px solid var(--bad);border-radius:4px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--bad)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.flightbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.flightbar::-webkit-scrollbar{display:none}

/* статистика */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.tile .v{font:700 30px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--ink2);margin-top:4px}
.tile.big{grid-column:1/-1;background:var(--hero);color:var(--hero-ink);border-color:transparent}
.tile.big .v{font-size:44px;color:var(--gold)}.tile.big .l{color:color-mix(in srgb,var(--hero-ink) 80%,transparent)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--f-text);fill:var(--muted)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .ln2{fill:none;stroke:var(--gold-ink);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.chart .pt{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{fill:var(--brand)}
.chart .zero{stroke:var(--ink2);stroke-width:1}
.readout{min-height:22px;font-size:14px;color:var(--ink2)}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.hbar .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.hc{border-radius:12px;padding:8px 6px;text-align:center;background:var(--surface2);font-size:12px;color:var(--ink2)}
.hc b{display:block;font-size:20px;color:var(--ink)}

/* вход и всплывающие */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.lock .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.modal textarea{font:12px/1.4 var(--f-mono)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.demo-bar{margin-inline:-16px;padding:6px 16px;background:var(--warn-soft);color:var(--ink);font-size:12px;text-align:center}
footer.foot{color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.swatch{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:12px;background:none}
@media (min-width:900px){
  .tabbar{position:sticky;top:61px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);margin-inline:-16px}
  .cta{bottom:0}
  main{padding-bottom:110px}
  .toast{bottom:90px}
}
@media (max-width:380px){.h1{font-size:26px}.big output{font-size:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hole-count,.cta-count{white-space:nowrap}

</style>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<script>
/* src/booking.js */
/*
 * Ядро системы записи гольф-клуба «Знаменский».
 * Чистые функции над объектом состояния: слоты, вместимость, прокат,
 * закрытия по погоде, цены, напоминания, отчёты.
 * Работает и в браузере (глобальный Core), и в Node (module.exports),
 * поэтому те же правила можно перенести на сервер без переписывания.
 *
 * Время клуба: дата 'YYYY-MM-DD' и минуты от полуночи. Часовой пояс
 * не участвует в расчётах: клуб работает по местному времени.
 */
(function (root) {
  'use strict';

  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var WD = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  var WD_SHORT = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var ACTIVE = { confirmed: 1, checked_in: 1 };

  /* ---------- даты и время ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function parseDate(s) { var p = s.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
  function dayIndex(s) { var p = parseDate(s); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 86400000); }
  function addDays(s, n) {
    var p = parseDate(s);
    var t = new Date(Date.UTC(p.y, p.m - 1, p.d + n));
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
  }
  function weekday(s) { var p = parseDate(s); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }
  function isValidDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && addDays(s, 0) === s; }
  function absMin(date, min) { return dayIndex(date) * 1440 + min; }
  function fmt(min) { return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function overlaps(a1, a2, b1, b2) { return a1 < b2 && b1 < a2; }
  function ruDate(date, refDate) {
    if (refDate && date === refDate) return 'сегодня';
    if (refDate && date === addDays(refDate, 1)) return 'завтра';
    var p = parseDate(date);
    return p.d + ' ' + MONTHS[p.m - 1];
  }
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function normalizePhone(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.length === 11 && (d[0] === '7' || d[0] === '8')) d = d.slice(1);
    else if (d.length !== 10) return null;
    return '+7' + d;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Точки расширения для надстроек (кошелёк, соревнования): ядро записи про них ничего не знает.
  var hooks = { validate: null, quote: null, newClient: null, created: null, cancelled: null };

  /* ---------- настройки и состояние ---------- */
  function defaultConfig() {
    return {
      club: { name: 'Гольф-клуб «Знаменский»' },
      horizonDays: 21,
      noticeMin: { course: 60, range: 60, lesson: 120 },
      freeCancelHours: 24,
      maxActivePerPhone: 4,
      course: { name: 'Поле, 9 лунок', roundMin: 120, interval: 10, first: 540, last: 900, capacity: 4, price: { guest: 2500, member: 1500 } },
      range: { name: 'Драйвинг-рейндж', bays: 6, slotMin: 60, first: 540, last: 990, maxBaysPerBooking: 3, price: { guest: 600, member: 400 } },
      lessonTypes: [
        { min: 30, price: { guest: 1500, member: 1200 } },
        { min: 60, price: { guest: 2500, member: 2000 } }
      ],
      inventory: [
        { id: 'clubs', name: 'Комплект клюшек', total: 8, price: 300, rule: 'perPlayer', where: ['course', 'range', 'lesson'] },
        { id: 'cart', name: 'Электрокар', total: 4, price: 1500, rule: 'perTwo', where: ['course'] },
        { id: 'trolley', name: 'Тележка для сумки', total: 6, price: 200, rule: 'perPlayer', where: ['course'] }
      ]
    };
  }
  function defaultState() {
    return {
      v: 1, seq: 0, meta: { cseq: 5 },
      config: defaultConfig(),
      coaches: [
        { id: 'c1', name: 'Тренер 1', days: [2, 3, 4, 5, 6], from: 600, to: 1080 },
        { id: 'c2', name: 'Тренер 2', days: [6, 0, 1], from: 540, to: 1020 }
      ],
      clients: [
        { id: 'c0001', phone: '+79000000001', name: 'Алексей М.', member: true },
        { id: 'c0002', phone: '+79000000002', name: 'Ирина С.', member: true },
        { id: 'c0003', phone: '+79000000003', name: 'Сергей Л.', member: true },
        { id: 'c0004', phone: '+79000000004', name: 'Ольга В.', member: false },
        { id: 'c0005', phone: '+79000000005', name: 'Николай Т.', member: false }
      ],
      bookings: [],
      closures: []
    };
  }

  /* ---------- вспомогательные выборки ---------- */
  function isActive(b) { return !!ACTIVE[b.status]; }
  function findClient(st, phone) { return st.clients.find(function (c) { return c.phone === phone; }) || null; }
  // Клиент создаётся один раз по телефону. id непрозрачный: по нему записи, раунды и абонементы привязаны к человеку.
  function ensureClient(st, name, phone, member) {
    var c = findClient(st, phone);
    if (c) return c;
    st.meta.cseq = (st.meta.cseq || st.clients.length) + 1;
    c = { id: 'c' + String(st.meta.cseq).padStart(4, '0'), phone: phone, name: name, member: !!member };
    if (hooks.newClient) hooks.newClient(st, c);
    st.clients.push(c);
    return c;
  }
  function coachName(st, id) { var c = st.coaches.find(function (x) { return x.id === id; }); return c ? c.name : '—'; }
  function itemOf(st, id) { return st.config.inventory.find(function (i) { return i.id === id; }) || null; }
  function typeLabel(st, b) {
    if (b.type === 'course') return 'Игра на поле';
    if (b.type === 'range') return 'Драйвинг-рейндж';
    return 'Занятие, ' + coachName(st, b.coachId) + ', ' + b.lessonMin + ' мин';
  }
  function closureApplies(c, type) {
    if (c.resource === 'all') return true;
    if (type === 'lesson') return false;
    return c.resource === type;
  }
  function closedFor(st, type, date, start, end) {
    return st.closures.find(function (c) {
      return c.date === date && closureApplies(c, type) && overlaps(start, end, c.from, c.to);
    }) || null;
  }

  // Свободно штук в окне [start, end): всего минус пиковая одновременная нагрузка.
  // Пик достигается в начале окна или в начале одной из пересекающихся записей,
  // поэтому проверяем только эти моменты. Записи, которые идут одна за другой,
  // не суммируются: электрокар возвращается и сразу выдаётся снова.
  function rentalFree(st, itemId, date, start, end, excludeId) {
    var item = itemOf(st, itemId);
    if (!item) return 0;
    var rel = [];
    st.bookings.forEach(function (b) {
      if (!isActive(b) || b.id === excludeId || b.date !== date) return;
      if (!overlaps(b.start, b.end, start, end)) return;
      var q = 0;
      b.rentals.forEach(function (r) { if (r.itemId === itemId) q += r.qty; });
      if (q > 0) rel.push({ s: b.start, e: b.end, q: q });
    });
    var points = [start];
    rel.forEach(function (r) { if (r.s > start && r.s < end) points.push(r.s); });
    var peak = 0;
    points.forEach(function (t) {
      var u = 0;
      rel.forEach(function (r) { if (r.s <= t && t < r.e) u += r.q; });
      if (u > peak) peak = u;
    });
    return Math.max(0, item.total - peak);
  }

  /* ---------- слоты ---------- */
  // o: { staff, coachId, lessonMin, excludeId }
  function slotsFor(st, type, date, now, o) {
    o = o || {};
    var cfg = st.config, starts = [], dur, cap, out = [];
    if (type === 'course') {
      dur = cfg.course.roundMin; cap = cfg.course.capacity;
      for (var t = cfg.course.first; t <= cfg.course.last; t += cfg.course.interval) starts.push(t);
    } else if (type === 'range') {
      dur = cfg.range.slotMin; cap = cfg.range.bays;
      for (var r = cfg.range.first; r <= cfg.range.last; r += cfg.range.slotMin) starts.push(r);
    } else if (type === 'lesson') {
      var coach = st.coaches.find(function (c) { return c.id === o.coachId; });
      if (!coach || coach.days.indexOf(weekday(date)) < 0) return [];
      dur = o.lessonMin || 60; cap = 1;
      for (var l = coach.from; l + dur <= coach.to; l += 30) starts.push(l);
    } else return [];

    var nowAbs = absMin(now.date, now.min);
    var notice = (cfg.noticeMin[type] || 0);
    starts.forEach(function (start) {
      var end = start + dur, used = 0;
      st.bookings.forEach(function (b) {
        if (!isActive(b) || b.id === o.excludeId || b.type !== type || b.date !== date) return;
        if (type === 'course') { if (b.start === start) used += b.qty; }
        else if (type === 'range') { if (overlaps(b.start, b.end, start, end)) used += b.qty; }
        else if (b.coachId === o.coachId && overlaps(b.start, b.end, start, end)) used += 1;
      });
      var free = Math.max(0, cap - used);
      var abs = absMin(date, start);
      var status = 'open';
      if (closedFor(st, type, date, start, end)) status = 'closed';
      else if (abs <= nowAbs) status = 'past';
      else if (!o.staff && abs < nowAbs + notice) status = 'late';
      else if (free <= 0) status = 'full';
      out.push({ start: start, end: end, capacity: cap, used: used, free: free, status: status });
    });
    return out;
  }

  /* ---------- цены ---------- */
  function quote(st, req, member) {
    var cfg = st.config, lines = [], qty = Number(req.qty || 1), who = member ? 'member' : 'guest';
    if (req.type === 'course') {
      lines.push({ label: 'Раунд на 9 лунок × ' + qty, amount: cfg.course.price[who] * qty });
    } else if (req.type === 'range') {
      lines.push({ label: 'Рейндж, час × ' + qty + ' ' + plural(qty, 'станция', 'станции', 'станций'), amount: cfg.range.price[who] * qty });
    } else if (req.type === 'lesson') {
      var lt = cfg.lessonTypes.find(function (x) { return x.min === Number(req.lessonMin); });
      if (lt) lines.push({ label: 'Занятие ' + lt.min + ' мин', amount: lt.price ? lt.price[who] : 0 });
    }
    (req.rentals || []).forEach(function (r) {
      var it = itemOf(st, r.itemId);
      if (it && r.qty > 0) lines.push({ label: it.name + ' × ' + r.qty, amount: it.price * r.qty });
    });
    return { lines: lines, total: lines.reduce(function (a, l) { return a + l.amount; }, 0), member: !!member };
  }

  /* ---------- проверка и создание записи ---------- */
  // o: { staff, excludeId }
  function validateRequest(st, req, now, o) {
    o = o || {};
    var cfg = st.config, errs = [], staff = !!o.staff;
    function err(code, msg) { errs.push({ code: code, msg: msg }); }
    function fail(code, msg) { return { ok: false, errors: [{ code: code, msg: msg }] }; }

    var type = req.type;
    if (['course', 'range', 'lesson'].indexOf(type) < 0) return fail('type', 'Неизвестный вид записи');
    if (!isValidDate(req.date)) return fail('date', 'Некорректная дата');
    var qty = Number(req.qty || 1);
    var maxQty = type === 'course' ? cfg.course.capacity : type === 'range' ? cfg.range.maxBaysPerBooking : 2;
    if (!Number.isInteger(qty) || qty < 1) return fail('qty', 'Укажите количество');
    if (qty > maxQty) return fail('qty', 'Максимум за одну запись: ' + maxQty);

    var delta = dayIndex(req.date) - dayIndex(now.date);
    if (delta < 0) return fail('past', 'Эта дата уже прошла');
    if (!staff && delta > cfg.horizonDays) return fail('horizon', 'Запись открыта на ' + cfg.horizonDays + ' дн. вперёд');

    var lessonMin;
    if (type === 'lesson') {
      if (!st.coaches.some(function (c) { return c.id === req.coachId; })) return fail('coach', 'Выберите тренера');
      var lt = cfg.lessonTypes.find(function (x) { return x.min === Number(req.lessonMin); });
      if (!lt) return fail('lessonMin', 'Выберите длительность занятия');
      lessonMin = lt.min;
    }
    var slots = slotsFor(st, type, req.date, now, { staff: staff, coachId: req.coachId, lessonMin: lessonMin, excludeId: o.excludeId });
    var slot = slots.find(function (s) { return s.start === Number(req.start); });
    if (!slot) return fail('slot', 'Такого времени нет в расписании');

    if (slot.status === 'closed') err('closed', type === 'lesson' ? 'В это время клуб закрыт' : 'В это время закрыто (погода или обслуживание)');
    else if (slot.status === 'past') err('past', 'Это время уже прошло');
    else if (slot.status === 'late') err('late', 'Онлайн-запись закрывается за ' + (cfg.noticeMin[type] / 60) + ' ч до начала. Позвоните в клуб.');
    else if (slot.free < qty) {
      if (type === 'lesson') err('capacity', 'Тренер занят в это время');
      else err('capacity', slot.free > 0 ? 'В это время осталось мест: ' + slot.free : 'На это время мест нет');
    }

    var name = String((req.client && req.client.name) || '').trim();
    var phone = normalizePhone(req.client && req.client.phone);
    if (name.length < 2) err('name', 'Укажите имя');
    if (!phone) err('phone', 'Укажите телефон, например +7 900 000-00-00');

    var w = { start: slot.start, end: slot.end };
    (req.rentals || []).forEach(function (r) {
      if (!r.qty) return;
      var it = itemOf(st, r.itemId);
      if (!it) { err('rental', 'Неизвестная позиция проката'); return; }
      if (it.where.indexOf(type) < 0) { err('rentalWhere', it.name + ' недоступен для этого вида записи'); return; }
      var cap = it.rule === 'perTwo' ? Math.ceil(qty / 2) : qty;
      if (r.qty > cap) { err('rentalRule', it.name + ': не больше ' + cap + ' для ' + qty + ' ' + (type === 'range' ? 'станций' : 'чел.')); return; }
      var free = rentalFree(st, it.id, req.date, w.start, w.end, o.excludeId);
      if (r.qty > free) err('rental', it.name + ': свободно ' + free);
    });

    if (phone) {
      st.bookings.forEach(function (b) {
        if (!isActive(b) || b.id === o.excludeId || b.client.phone !== phone) return;
        if (b.date === req.date && overlaps(b.start, b.end, w.start, w.end)) {
          if (!errs.some(function (e) { return e.code === 'clientOverlap'; })) err('clientOverlap', 'У этого клиента уже есть запись на это время');
        }
      });
      if (!staff) {
        var nowAbs = absMin(now.date, now.min), cnt = 0;
        st.bookings.forEach(function (b) {
          if (isActive(b) && b.id !== o.excludeId && b.client.phone === phone && absMin(b.date, b.start) > nowAbs) cnt++;
        });
        if (cnt >= cfg.maxActivePerPhone) err('limit', 'Не больше ' + cfg.maxActivePerPhone + ' активных записей на один номер');
      }
    }

    var cl = phone ? findClient(st, phone) : null;
    var member = !!(cl && cl.member) || (staff && !!(req.client && req.client.member));
    var ctx = { type: type, qty: qty, lessonMin: lessonMin, phone: phone, client: cl, member: member, staff: staff, window: w, date: req.date, now: now, excludeId: o.excludeId };
    if (hooks.validate) hooks.validate(st, req, ctx, err);
    var qt = quote(st, { type: type, qty: qty, lessonMin: lessonMin, rentals: req.rentals }, member);
    if (hooks.quote) qt = hooks.quote(st, req, ctx, qt) || qt;
    return { ok: errs.length === 0, errors: errs, window: w, member: member, quote: qt, phone: phone, name: name, qty: qty, lessonMin: lessonMin, now: now, client: cl };
  }

  function createBooking(st, req, now, o) {
    o = o || {};
    var v = validateRequest(st, req, now, o);
    if (!v.ok) return v;
    st.seq += 1;
    var cli = ensureClient(st, v.name, v.phone, !!(o.staff && req.client && req.client.member));
    var b = {
      id: (st.config.idPrefix || 'ZN') + '-' + String(st.seq).padStart(4, '0'),
      type: req.type, date: req.date, start: v.window.start, end: v.window.end, qty: v.qty,
      coachId: req.type === 'lesson' ? req.coachId : null,
      lessonMin: req.type === 'lesson' ? v.lessonMin : null,
      rentals: (req.rentals || []).filter(function (r) { return r.qty > 0; }).map(function (r) { return { itemId: r.itemId, qty: r.qty }; }),
      client: { id: cli.id, name: v.name, phone: v.phone },
      productId: req.productId || null,
      member: v.member,
      channel: req.channel || (o.staff ? 'администратор' : 'сайт'),
      status: 'confirmed',
      createdAbs: o.createdAbs != null ? o.createdAbs : absMin(now.date, now.min),

function deepMerge(base, extra) {
  if (Array.isArray(extra) || typeof extra !== 'object' || extra === null) return extra === undefined ? base : extra;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  Object.keys(extra).forEach(k => { out[k] = (base && typeof base[k] === 'object' && !Array.isArray(base[k]) && base[k] !== null) ? deepMerge(base[k], extra[k]) : extra[k]; });
  return out;
}

function dispatch(act, el, e) {
  const fn = ACT[act];

  const r = fn(el, el.getAttribute('data-v'), e);
  if (r && typeof r.then === 'function') r.then(() => { if (booted) save(); }).catch(err => toast(err.message || 'Ошибка')); else if (booted) save();
}

/* ----- слоты ----- */
function slotsOn(b, date) {
  const n = now(), kind = b.kind;
  if (kind === 'course' || kind === 'range') return C.slotsFor(st, kind, date, n, {});
  const merged = {}, rank = { open: 5, late: 4, full: 3, closed: 2, past: 1 };
  st.coaches.forEach(co => {
    C.slotsFor(st, 'lesson', date, n, { coachId: co.id, lessonMin: 60 }).forEach(s => {
      const m = merged[s.start];
      if (!m || rank[s.status] > rank[m.status]) merged[s.start] = Object.assign({}, s, { coachId: co.id });
    });
  });
  return Object.keys(merged).map(Number).sort((a, b) => a - b).map(k => merged[k]);
}
const hasOpen = (b, date) => slotsOn(b, date).some(s => s.status === 'open');
function horizonDays() { return Math.min(14, st.config.horizonDays); }
function dateList(b) { const n = now(); return Array.from({ length: horizonDays() + 1 }, (_, i) => C.addDays(n.date, i)); }
function quickPicks(b) {
  const out = [];
  dateList(b).forEach(d => { if (out.length >= 3) return; const s = slotsOn(b, d).find(x => x.status === 'open'); if (s) out.push({ date: d, slot: s }); });
  return out;
}
function pickSlot(b, date, start) {
  b.date = date; b.start = start; b.errors = []; b.tried = false;
  const s = slotsOn(b, date).find(x => x.start === start);
  if (b.kind === 'lesson') b.coachId = s ? s.coachId : null;
  normalizeBook(b);
}
function maxQty(b) { return b.kind === 'course' ? st.config.course.capacity : b.kind === 'range' ? st.config.range.maxBaysPerBooking : 1; }
function slotFree(b) { const s = b.start == null ? null : slotsOn(b, b.date).find(x => x.start === b.start); return s ? s.free : null; }
function normalizeBook(b) {
  if (!b.kind) return;
  const free = slotFree(b);
  const cap = Math.max(1, Math.min(maxQty(b), free == null ? 99 : free));
  if (b.qty > cap) b.qty = cap;
  if (b.qty < 1) b.qty = 1;
  // прокат: не больше правил и остатка
  const win = b.start == null ? null : { s: b.start, e: b.start + (b.kind === 'course' ? st.config.course.roundMin : b.kind === 'range' ? st.config.range.slotMin : 60) };
  Object.keys(b.rentals).forEach(id => {
    const it = C.itemOf(st, id);
    if (!it || it.where.indexOf(b.kind) < 0) { delete b.rentals[id]; return; }
    const rule = it.rule === 'perTwo' ? Math.ceil(b.qty / 2) : b.qty;
    const free2 = win ? C.rentalFree(st, id, b.date, win.s, win.e) : it.total;
    b.rentals[id] = Math.max(0, Math.min(b.rentals[id], rule, free2));
    if (!b.rentals[id]) delete b.rentals[id];
  });
}
function reqOf(b) {
  return {
    type: KIND[b.kind].type, date: b.date, start: b.start, qty: b.kind === 'lesson' ? 1 : b.qty, coachId: b.coachId, lessonMin: 60,
    rentals: Object.keys(b.rentals).map(id => ({ itemId: id, qty: b.rentals[id] })), client: { name: b.name, phone: b.phone }, channel: b.channel, buy: b.buy || undefined

}

function programOptions(c) {
  const out = [];
  st.club.products.filter(p => p.kind === 'program').forEach(p => {
    if (c) {
      if (W.checkRequires(st, p, c.id)) return;
      const held = st.entitlements.some(e => e.clientId === c.id && e.productId === p.id && e.status !== 'void' && e.expiresOn >= now().date && W.left(e, 'lesson') > 0);
      if (held) return;
      if (p.promo && !p.requiresDone) return;
    } else if (p.requiresDone || p.promo || !p.entry) return; // новичку показываем только «Первый флаг»
    out.push(p);
  });
  return out;
}

function newSetup() {

/* src/ui/view-stats.js */
/* ===== UI: статистика и аналитика игры ===== */
ui.stats = { period: 'all', subject: 'me' };

/* ----- графики (SVG, один масштаб на ось) ----- */
function niceTicks(min, max, n) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
  return t;
}
// pts: [{ label, y, tip }]; extra: второй ряд [{y}] той же длины (пунктир)
function lineChart(id, pts, o) {
  o = o || {};
  const W = 340, Hh = 190, ml = 34, mr = 10, mt = 10, mb = 26, iw = W - ml - mr, ih = Hh - mt - mb;
  const ys = pts.map(p => p.y).concat((o.extra || []).map(p => p.y)).filter(v => v != null);
  if (!ys.length) return '<div class="empty">Пока мало данных</div>';
  const ticks = niceTicks(Math.min.apply(null, ys), Math.max.apply(null, ys), 4), lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => ml + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1)), Y = v => mt + ih - (v - lo) / (hi - lo) * ih;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc(o.label || '') + '">';
  ticks.forEach(t => { s += '<line class="ax" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text x="' + (ml - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + String(t).replace('.', ',') + '</text>'; });
  if (lo < 0 && hi > 0) s += '<line class="zero" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>';
  const every = Math.max(1, Math.ceil(pts.length / 6));
  pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) s += '<text x="' + X(i) + '" y="' + (Hh - 8) + '" text-anchor="middle">' + esc(p.label) + '</text>'; });
  if (o.extra) s += '<path class="ln2" d="' + o.extra.map((p, i) => p.y == null ? '' : (i === 0 || o.extra[i - 1].y == null ? 'M' : 'L') + X(i) + ' ' + Y(p.y)).join(' ') + '"/>';
  s += '<path class="ln" d="' + pts.map((p, i) => p.y == null ? '' : (i === 0 || pts[i - 1].y == null ? 'M' : 'L') + X(i) + ' ' + Y(p.y)).join(' ') + '"/>';
  pts.forEach((p, i) => { if (p.y == null) return; s += '<circle class="pt" cx="' + X(i) + '" cy="' + Y(p.y) + '" r="4.5"/><circle class="hit" cx="' + X(i) + '" cy="' + Y(p.y) + '" r="15" data-act="st.tip" data-v="' + id + '" data-tip="' + esc(p.tip) + '"/>'; });
  return s + '</svg><div class="readout" id="ro-' + id + '" aria-live="polite">' + esc(o.hint || 'Нажмите на точку, чтобы увидеть раунд') + '</div>';
}
ACT['st.tip'] = (el, v) => { const ro = $('#ro-' + v); if (ro) ro.textContent = el.getAttribute('data-tip'); };
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('.chart .hit'); if (el) ACT['st.tip'](el, el.getAttribute('data-v')); });
function hbars(items, fmtv, max) {
  const m = max || Math.max.apply(null, items.map(i => Math.abs(i.v))) || 1;
  return '<div class="stack" style="gap:8px">' + items.map(i => '<div class="hbar"><span>' + esc(i.l) + '</span><div class="tr"><i style="width:' + Math.max(2, Math.abs(i.v) / m * 100) + '%;' + (i.c ? 'background:' + i.c : '') + '"></i></div><b>' + fmtv(i.v) + '</b></div>').join('') + '</div>';
}

/* ----- данные ----- */
function periodFrom(p, n) { return p === '30' ? C.addDays(n.date, -30) : p === '90' ? C.addDays(n.date, -90) : p === 'season' ? n.date.slice(0, 4) + '-04-01' : '0000-00-00'; }
function subjects() {
  const c = me(); if (!c) return [];
  const out = [{ key: 'me', name: 'Я', rounds: R.ownRounds(st, c.id) }];
  const flights = {}; st.rounds.forEach(r => { if (r.flightId && r.ownerId === c.id && r.finished) flights[r.flightId] = 1; });
  const m = {};
  st.rounds.forEach(r => { if (r.finished && r.flightId && flights[r.flightId] && r.ownerId !== c.id) { const k = r.ownerId || 'n:' + r.name; (m[k] = m[k] || { key: k, name: r.name, rounds: [] }).rounds.push(r); } });
  return out.concat(Object.keys(m).map(k => m[k]));
}
function perNine(r) { const t = H.totals(r); return t.holes ? t.toPar * 9 / t.holes : null; }

function statsBody(rounds, opts) {
  opts = opts || {};
  const n = now(), from = periodFrom(ui.stats.period, n);
  const rs = rounds.filter(r => r.finished && r.date >= from).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1));
  if (!rs.length) return '<div class="empty">За этот период раундов нет. Сыграйте раунд на вкладке «Игра», и здесь появится аналитика.</div>';
  const a = H.aggregate(rs), holes = a.holes;
  const avg9 = a.toPar / holes * 9, sf9 = a.stableford / holes * 9;
  let h = '<div class="tiles">' + (opts.hi ? '<div class="tile big"><div class="v">' + num1(opts.hi.hi) + '</div><div class="l">Индекс гандикапа' + (opts.hi.hi == null ? ': нужно ещё ' + (opts.hi.needed == null ? 3 : opts.hi.needed) + ' зачётных раунда' : '') + '</div></div>' : '') +
    '<div class="tile"><div class="v">' + a.rounds + '</div><div class="l">' + plural(a.rounds, 'раунд', 'раунда', 'раундов') + ', ' + holes + ' ' + plural(holes, 'лунка', 'лунки', 'лунок') + '</div></div>' +
    '<div class="tile"><div class="v">' + signed(avg9) + '</div><div class="l">к пару за 9 лунок</div></div>' +
    '<div class="tile"><div class="v">' + num1(sf9) + '</div><div class="l">очков за 9 лунок</div></div>' +
    '<div class="tile"><div class="v">' + (a.puttsHoles ? num1(a.putts / a.puttsHoles) : '—') + '</div><div class="l">патта на лунку</div></div>' +
    '<div class="tile"><div class="v">' + (a.firHoles ? Math.round(a.fir / a.firHoles * 100) + '%' : '—') + '</div><div class="l">попаданий в фервей</div></div>' +
    '<div class="tile"><div class="v">' + (a.girHoles ? Math.round(a.gir / a.girHoles * 100) + '%' : '—') + '</div><div class="l">грин в регуляции</div></div></div>';
  // динамика результата
  const pts = rs.map(r => { const v = perNine(r), p = r.date.split('-'); return { label: Number(p[2]) + '.' + p[1], y: Math.round(v * 10) / 10, tip: ruShort(r.date) + ', ' + r.course.name + ': ' + signed(v) + ' к пару за 9 лунок' + (r.counting ? ', зачётный' : '') }; });
  const ma = pts.map((p, i) => { const w = pts.slice(Math.max(0, i - 2), i + 1); return { y: Math.round(w.reduce((s, x) => s + x.y, 0) / w.length * 10) / 10 }; });
  h += '<section class="card stack"><div><h2 class="h2" style="font-size:18px">Динамика результата</h2><div class="hint">К пару за 9 лунок. Ниже — лучше. Пунктир: среднее за три раунда.</div></div>' + lineChart('dyn', pts, { extra: ma, label: 'Результат к пару по раундам' }) + '</section>';
  if (opts.hist && opts.hist.points.length >= 2) {
    const hp = opts.hist.points.filter(p => p.date >= from).map(p => { const q = p.date.split('-'); return { label: Number(q[2]) + '.' + q[1], y: p.hi, tip: ruShort(p.date) + ': индекс ' + num1(p.hi) }; });
    if (hp.length >= 2) h += '<section class="card stack"><div><h2 class="h2" style="font-size:18px">Индекс гандикапа</h2><div class="hint">После каждого зачётного раунда. Расчёт по формулам WHS, официальный индекс считает АГР.</div></div>' + lineChart('hcp', hp, { label: 'Индекс гандикапа' }) + '</section>';
  }
  // распределение результатов
  const tot = holes || 1, res = a.res;
  h += '<section class="card stack"><h2 class="h2" style="font-size:18px">Какие результаты на лунках</h2>' + hbars([{ l: 'Бёрди и лучше', v: (res.eagle + res.birdie) / tot * 100, c: 'var(--ok)' }, { l: 'Пар', v: res.par / tot * 100 }, { l: 'Бёги', v: res.bogey / tot * 100, c: 'var(--warn)' }, { l: 'Дубль-бёги', v: res.double / tot * 100, c: 'var(--bad)' }, { l: 'Хуже', v: res.worse / tot * 100, c: 'var(--bad)' }], v => Math.round(v) + '%', 100) + '</section>';
  // по пару лунки
  const pp = [3, 4, 5].filter(p => a.byPar[p]).map(p => ({ l: 'Пар ' + p, v: a.byPar[p].over / a.byPar[p].holes, n: a.byPar[p].holes }));
  if (pp.length) h += '<section class="card stack"><div><h2 class="h2" style="font-size:18px">Где теряете удары</h2><div class="hint">Среднее к пару на лунке. Чем короче полоса, тем лучше.</div></div>' + hbars(pp.map(x => ({ l: x.l + ' (' + x.n + ')', v: x.v, c: x.v > 1.3 ? 'var(--warn)' : '' })), v => signed(v), 2.5) + '</section>';
  // лунки поля клуба
  const home = Object.keys(a.byHole).map(k => a.byHole[k]).filter(x => x.course === st.club.course.name).sort((x, y) => x.n - y.n);
  if (home.length) {
    const mx = Math.max.apply(null, home.map(x => x.over / x.cnt));
    h += '<section class="card stack"><div><h2 class="h2" style="font-size:18px">Лунки «' + esc(st.club.brand.short) + '»</h2><div class="hint">Среднее к пару. Тёмным отмечены самые трудные для вас.</div></div><div class="heat">' + home.map(x => { const v = x.over / x.cnt, hot = v >= mx - 0.01 && mx > 0.4; return '<div class="hc" style="' + (hot ? 'background:var(--warn-soft)' : v <= 0.4 ? 'background:var(--brand-soft)' : '') + '"><b>' + x.n + '</b>' + signed(v) + '<br>лучш. ' + x.best + '</div>'; }).join('') + '</div></section>';
  }
  // по месяцам
  const byM = {}; rs.forEach(r => { const k = r.date.slice(0, 7); (byM[k] = byM[k] || []).push(perNine(r)); });
  const mk = Object.keys(byM).sort();
  if (mk.length >= 2) {
    const mp = mk.map(k => ({ label: MONTHS[Number(k.slice(5)) - 1].slice(0, 3), y: Math.round(byM[k].reduce((s, x) => s + x, 0) / byM[k].length * 10) / 10, tip: MONTHS[Number(k.slice(5)) - 1] + ': в среднем ' + signed(byM[k].reduce((s, x) => s + x, 0) / byM[k].length) + ' к пару, раундов ' + byM[k].length }));
    h += '<section class="card stack"><div><h2 class="h2" style="font-size:18px">По месяцам</h2><div class="hint">Средний результат к пару за 9 лунок.</div></div>' + lineChart('mon', mp, { label: 'Результат по месяцам' }) + '</section>';
  }
  h += '<section class="sec"><h2 class="h3">Раунды</h2><div class="stack">' + rs.slice().reverse().slice(0, opts.limit || 8).map(r => { const t = H.totals(r); return '<button class="opt" data-act="st.round" data-v="' + r.id + '"><span class="grow"><b>' + esc(r.course.name) + '</b><small>' + ruShort(r.date) + ' · ' + esc(r.tee.name) + (r.counting ? ' · зачётный' : '') + (Object.keys(r.notes || {}).some(k => (r.notes[k] || '').trim()) ? ' · есть заметки' : '') + '</small></span><span style="text-align:right"><b style="font:700 22px var(--f-display)">' + t.gross + '</b><small>' + signed(t.toPar) + ' · ' + t.stableford + ' оч.</small></span></button>'; }).join('') + '</div></section>';
  return h;
}

function statsView() {
  const c = me();
  if (!c) return '<div class="stack"><section class="hero">' + contours() + '<div class="gold-line">Статистика</div><h1 class="h1">Аналитика вашей игры</h1><p>Динамика результата, гандикап, точность ударов и самые трудные лунки.</p></section><div class="empty">Войдите во вкладке «Мой клуб», чтобы увидеть свои раунды.</div><button class="btn primary block" data-act="tab" data-v="me">Войти</button></div>';
  const subs = subjects(); let sub = subs.find(x => x.key === ui.stats.subject) || subs[0];
  const isMe = sub.key === 'me';
  const periods = [['30', '30 дней'], ['90', '90 дней'], ['season', 'Сезон'], ['all', 'Всё время']];
  let h = '<div class="stack"><h1 class="h1">Статистика</h1>' +
    (subs.length > 1 ? '<div class="chips">' + subs.map(s => '<button class="chip" data-act="st.subject" data-v="' + esc(s.key) + '" aria-pressed="' + (sub.key === s.key) + '">' + esc(s.name) + '</button>').join('') + '</div><div class="hint">Партнёры по флайту: видны раунды, сыгранные вместе с вами.</div>' : '') +
    '<div class="seg" style="align-self:flex-start;max-width:100%;overflow-x:auto">' + periods.map(p => '<button data-act="st.period" data-v="' + p[0] + '" aria-pressed="' + (ui.stats.period === p[0]) + '">' + p[1] + '</button>').join('') + '</div>';
  const hist = isMe ? H.history(sub.rounds) : null;
  h += statsBody(sub.rounds, { hi: isMe ? R.hiOf(st, c.id) : null, hist });
  return h + '</div>';
}

/* ----- стартовый лист ----- */
function names(bs) { return bs.map(b => esc(b.client.name) + (b.qty > 1 && b.type !== 'lesson' ? ' ×' + b.qty : '') + (b.paidWith ? ' <span class="badge free">прогр.</span>' : '') + itemsText(b).replace(' · прокат: ', ' · ')).join('; '); }
function sheetPips(used, cap) { return '<span class="pips" aria-hidden="true">' + Array.from({ length: cap }, (_, i) => '<i class="' + (i < used ? 'on' : '') + '"></i>').join('') + '</span>'; }
function sSheet() {
  const t = now(), d = ui.sheetDate;
  let h = '<div class="row wrap-r"><button class="btn sm" data-act="sdate" data-d="-1" aria-label="Предыдущий день">‹</button><b style="font:700 20px var(--f-display)">' + dayLabel(d) + '</b><button class="btn sm" data-act="sdate" data-d="1" aria-label="Следующий день">›</button><button class="btn sm ghost" data-act="sdate" data-d="0">Сегодня</button><input type="date" class="in sm" style="width:auto" data-in="sdate" value="' + d + '" aria-label="Дата"></div>';
  st.closures.filter(c => c.date === d).forEach(c => { h += '<div class="errbox">Закрыто: ' + (c.resource === 'course' ? 'поле' : c.resource === 'range' ? 'рейндж' : 'весь клуб') + ' ' + fmt(c.from) + '–' + fmt(c.to) + ', ' + esc(c.reason) + '</div>'; });
  const ev = st.events.filter(e => e.date === d && e.status !== 'finished'); ev.forEach(e => { h += '<div class="okbox">' + ic('trophy').replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"') + ' Соревнование: <b>' + esc(e.title) + '</b>, старт ' + fmt(e.startMin) + '</div>'; });
  const canBook = ui.role === 'admin';
  const rows = (type) => C.slotsFor(st, type, d, t, { staff: true }).map(s => {
    const bs = st.bookings.filter(b => C.isActive(b) && b.type === type && b.date === d && (type === 'course' ? b.start === s.start : C.overlaps(b.start, b.end, s.start, s.end)));
    return '<div class="sheetrow ' + (s.status === 'closed' ? 'closed' : bs.length ? '' : 'free') + '" style="grid-template-columns:56px 74px minmax(0,1fr) auto"><span class="mono">' + fmt(s.start) + '</span>' + sheetPips(s.used, s.capacity) + '<span style="min-width:0">' + (s.status === 'closed' ? 'закрыто' : bs.length ? names(bs) : 'свободно') + '</span>' + (s.status === 'open' && canBook ? '<button class="btn sm" data-act="sb.open" data-v="' + type + '" data-s="' + s.start + '">Записать</button>' : '<span></span>') + '</div>';
  }).join('');
  h += '<h2 class="h2">Поле</h2><div class="card" style="padding:0;overflow:hidden">' + rows('course') + '</div><h2 class="h2">Рейндж</h2><div class="card" style="padding:0;overflow:hidden">' + rows('range') + '</div>';
  h += '<h2 class="h2">Тренеры</h2><div class="card" style="padding:0;overflow:hidden">' + st.coaches.map(c => {
    const works = c.days.indexOf(C.weekday(d)) >= 0;
    const ls = st.bookings.filter(b => C.isActive(b) && b.type === 'lesson' && b.date === d && b.coachId === c.id).sort((a, b) => a.start - b.start);
    const free = C.slotsFor(st, 'lesson', d, t, { staff: true, coachId: c.id, lessonMin: 60 }).filter(s => s.status === 'open').length;
    return '<div class="sheetrow ' + (works ? '' : 'closed') + '" style="grid-template-columns:130px minmax(0,1fr) auto"><b>' + esc(c.name) + '</b><span style="min-width:0">' + (!works ? 'не работает' : ls.length ? ls.map(b => fmt(b.start) + ' ' + esc(b.client.name) + (b.paidWith ? ' <span class="badge free">прогр.</span>' : '')).join('; ') : 'занятий нет') + (works ? ' <span class="badge">свободно: ' + free + '</span>' : '') + '</span>' + (works && canBook ? '<button class="btn sm" data-act="sb.open" data-v="lesson" data-c="' + c.id + '">Записать</button>' : '<span></span>') + '</div>';
  }).join('') + '</div>';
  return '<div class="stack">' + h + '</div>';
}
ACT['sdate'] = (el, v) => { const d = Number(el.getAttribute('data-d')); ui.sheetDate = d === 0 ? now().date : C.addDays(ui.sheetDate, d); render(); };
INP['sdate'] = el => { if (C.isValidDate(el.value)) { ui.sheetDate = el.value; render(); } };

/* ----- быстрая запись администратором ----- */
function sbReq() { const b = ui.sb; return { type: b.type, date: b.date, start: b.start, qty: b.type === 'lesson' ? 1 : b.qty, coachId: b.coachId, lessonMin: 60, rentals: Object.keys(b.rentals).map(id => ({ itemId: id, qty: b.rentals[id] })), client: { name: b.name, phone: b.phone, member: b.member }, channel: 'администратор', note: b.note }; }

    (items.length ? '<div class="card flat stack">' + items.map(it => '<div class="row sp"><span>' + esc(it.name) + ' <span class="muted small">' + rub(it.price) + '</span></span>' + stepper('sb.rent', b.rentals[it.id] || 0, { id: it.id, sm: true, min: 0 }) + '</div>').join('') + '</div>' : '') +

LIVE['sbq'] = () => {
  const b = ui.sb; if (!b) return '';
  const v = C.validateRequest(st, sbReq(), now(), { staff: true });
  return (v.errors.length ? '<div class="errbox">' + v.errors.map(e => '<span>' + esc(e.msg) + '</span>').join('') + '</div>' : '') + '<div class="card flat">' + quoteLines(v.quote) + '</div><button class="btn primary block" data-act="sb.go"' + (v.ok ? '' : ' disabled') + '>Записать</button>';

  const type = el.getAttribute('data-v'), s = el.getAttribute('data-s'), coach = el.getAttribute('data-c');
  ui.sb = { type, date: ui.sheetDate, start: s ? Number(s) : null, coachId: coach || null, qty: 1, name: '', phone: '', member: false, rentals: {}, note: '' };

ACT['sb.rent'] = el => { const b = ui.sb, id = el.getAttribute('data-id'); b.rentals[id] = Math.max(0, (b.rentals[id] || 0) + Number(el.getAttribute('data-d'))); if (!b.rentals[id]) delete b.rentals[id]; sbModal(); };
INP['sb.date'] = el => { if (C.isValidDate(el.value)) { ui.sb.date = el.value; const f = C.slotsFor(st, ui.sb.type, ui.sb.date, now(), { staff: true, coachId: ui.sb.coachId, lessonMin: 60 }).find(x => x.status === 'open'); ui.sb.start = f ? f.start : null; sbModal(); } };
INP['sb.start'] = el => { ui.sb.start = Number(el.value); refreshLive(); };
INP['sb.phone'] = el => {
  const b = ui.sb; b.phone = el.value;

  if (c) { b.name = c.name; b.member = !!c.member; const n = $('#sb-name'); if (n) n.value = c.name; const m = $('[data-in="sb.member"]'); if (m) m.checked = b.member; }

INP['sb.name'] = el => { ui.sb.name = el.value; refreshLive(); };
INP['sb.member'] = el => { ui.sb.member = el.checked; refreshLive(); };
INP['sb.note'] = el => { ui.sb.note = el.value; };
ACT['sb.go'] = () => {
  const r = C.createBooking(st, sbReq(), now(), { staff: true });
  if (!r.ok) { toast(r.errors[0].msg); return; }
  if (ui.sb.member) { const c = clientOf(r.booking.client.id); if (c) c.member = true; }
  ui.sb = null; closeModal(); toast('Записано: ' + r.booking.id); render();
};

/* ----- записи ----- */
function sList() {
  const f = ui.lf, t = now(), a = C.absMin(t.date, t.min);
  let list = st.bookings.slice();
  if (f.type !== 'all') list = list.filter(b => b.type === f.type);
  if (f.status === 'upcoming') list = list.filter(b => C.isActive(b) && C.absMin(b.date, b.end) > a);
  else if (f.status === 'cancelled') list = list.filter(b => !C.isActive(b));
  if (f.q.trim()) { const q = f.q.trim().toLowerCase(); list = list.filter(b => (b.client.name + ' ' + b.client.phone + ' ' + b.id).toLowerCase().indexOf(q) >= 0); }
  list.sort((x, y) => C.absMin(x.date, x.start) - C.absMin(y.date, y.start));
  const total = list.length; list = list.slice(0, 60);
  let h = '<div class="row wrap-r"><input class="in sm grow" data-in="lf.q" placeholder="Поиск: имя, телефон, номер" value="' + esc(f.q) + '"><select class="in sm" style="width:auto" data-in="lf.type">' + [['all', 'Всё'], ['course', 'Поле'], ['range', 'Рейндж'], ['lesson', 'Занятия']].map(o => '<option value="' + o[0] + '"' + (f.type === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select><select class="in sm" style="width:auto" data-in="lf.status">' + [['upcoming', 'Предстоящие'], ['cancelled', 'Отменённые'], ['all', 'Все']].map(o => '<option value="' + o[0] + '"' + (f.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>';
  if (ui.moving) h += moverView();
  h += '<div class="card" style="padding:0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>№</th><th>Когда</th><th>Клиент</th><th>Что</th><th class="r">Сумма</th><th>Статус</th><th></th></tr></thead><tbody>' + list.map(b => {
    const can = C.isActive(b), canAdm = ui.role === 'admin';
    return '<tr><td class="mono">' + esc(b.id) + '</td><td>' + dayLabel(b.date) + '<br><b>' + fmt(b.start) + '</b></td><td>' + esc(b.client.name) + '<br><span class="muted small">' + esc(b.client.phone) + '</span></td><td>' + esc(C.typeLabel(st, b)) + (b.type !== 'lesson' ? ' × ' + b.qty : '') + '<span class="muted small">' + itemsText(b) + '</span></td><td class="r num">' + (b.price.total === 0 ? '<span class="muted">0</span>' : rub(b.price.total)) + (b.price.buy ? '<br><span class="badge gold">курс</span>' : b.paidWith ? '<br><span class="badge free">по ' + (b.paidWith.length && st.entitlements.find(e => e.id === b.paidWith[0].entId) && st.entitlements.find(e => e.id === b.paidWith[0].entId).source === 'certificate' ? 'сертиф.' : 'прогр.') + '</span>' : '') + '</td><td>' + statusBadge(b) + '</td><td class="r" style="white-space:nowrap">' +
      (can && canAdm ? '<button class="btn sm" data-act="checkin" data-v="' + esc(b.id) + '">Пришёл</button> <button class="btn sm" data-act="move" data-v="' + esc(b.id) + '">Перенос</button> <button class="btn sm danger" data-act="scancel" data-v="' + esc(b.id) + '">Отмена</button>' : b.burned && canAdm ? '<button class="btn sm" data-act="restore" data-v="' + esc(b.id) + '">Вернуть занятие</button>' : '') + '</td></tr>';
  }).join('') + '</tbody></table></div></div>' + (total > 60 ? '<div class="hint">Показаны первые 60 из ' + total + '. Уточните поиск.</div>' : '') + (!list.length ? '<div class="empty">Ничего не найдено</div>' : '');
  return '<div class="stack">' + h + '</div>';
}
INP['lf.q'] = (el, k) => { ui.lf.q = el.value; clearTimeout(INP._lf); INP._lf = setTimeout(() => { const p = el.selectionStart; render(); const e = $('[data-in="lf.q"]'); if (e) { e.focus(); e.setSelectionRange(p, p); } }, 350); };
INP['lf.type'] = el => { ui.lf.type = el.value; render(); };
INP['lf.status'] = el => { ui.lf.status = el.value; render(); };
ACT['checkin'] = (el, v) => { C.checkIn(st, v); toast('Отмечено: гость пришёл'); render(); };
ACT['scancel'] = (el, v) => {
  if (!confirmStep('sc' + v, 'Нажмите ещё раз, чтобы отменить запись')) return;
  const r = C.cancelBooking(st, v, now(), 'staff'); if (!r.ok) return toast(r.errors[0].msg);

ACT['move'] = (el, v) => { ui.moving = v; ui.moveDate = null; render(); };
ACT['move-close'] = () => { ui.moving = null; render(); };
INP['movedate'] = el => { if (C.isValidDate(el.value)) { ui.moveDate = el.value; render(); } };
function moverView() {
  const b = C.getBooking(st, ui.moving); if (!b || !C.isActive(b)) { ui.moving = null; return ''; }
  const date = ui.moveDate || b.date;
  const slots = C.slotsFor(st, b.type, date, now(), { staff: true, coachId: b.coachId, lessonMin: b.lessonMin, excludeId: b.id }).filter(s => s.status === 'open' && s.free >= (b.type === 'lesson' ? 1 : b.qty));
  return '<div class="card gold stack"><div class="row sp"><b>Перенос записи ' + esc(b.id) + '</b><button class="btn sm ghost" data-act="move-close">Закрыть</button></div><div class="small ink2">' + esc(b.client.name) + ', сейчас ' + dayLabel(b.date) + ' в ' + fmt(b.start) + '</div><input type="date" class="in sm" style="width:auto;align-self:flex-start" data-in="movedate" value="' + date + '"><div class="chips">' + (slots.map(s => '<button class="chip sm" data-act="move-pick" data-v="' + s.start + '" aria-pressed="' + (date === b.date && s.start === b.start) + '">' + fmt(s.start) + '</button>').join('') || '<span class="muted">На эту дату нет подходящего времени</span>') + '</div></div>';
}
ACT['move-pick'] = (el, v) => {
  const b = C.getBooking(st, ui.moving), date = ui.moveDate || b.date;
  const r = C.rescheduleBooking(st, b.id, { date, start: Number(v) }, now(), { staff: true });

/* ----- клиенты ----- */

  const out = [];
  if (c.member) out.push(badge('Член клуба', 'gold'));
  const s = walletOf(c.id); Object.keys(s).forEach(u => out.push(badge(s[u] + ' ' + W.unitWord(u, s[u]), 'free')));
  return out.join(' ');
}
function sClients() {
  if (ui.clientSel) return clientCard(clientOf(ui.clientSel));

  if (q) list = list.filter(c => (c.name + ' ' + c.phone).toLowerCase().indexOf(q) >= 0);
  const total = list.length;

function mix(hex, other, k) { const a = hex.replace('#', ''), b = other.replace('#', ''); const f = i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - k) + parseInt(b.substr(i, 2), 16) * k).toString(16).padStart(2, '0'); return '#' + f(0) + f(2) + f(4); }
INP['theme'] = el => {
  const v = el.value, k = el.getAttribute('data-k'), P = st.club.brand.palette;
  if (k === 'brand') { P.light.brand = v; P.light.hero = v; P.dark.hero = v; P.dark.brand = mix(v, '#FFFFFF', 0.45); P.light.brandSoft = mix(v, '#FFFFFF', 0.88); P.dark.brandSoft = mix(v, '#000000', 0.35); P.light.ink = mix(v, '#000000', 0.62); }
  if (k === 'gold') { P.light.gold = v; P.dark.gold = v; P.light.goldInk = mix(v, '#000000', 0.5); P.dark.goldInk = mix(v, '#FFFFFF', 0.25); P.light.goldSoft = mix(v, '#FFFFFF', 0.8); P.dark.goldSoft = mix(v, '#000000', 0.72); }
  if (k === 'bg') { P.light.bg = v; P.light.surface2 = mix(v, '#000000', 0.04); }
  cfgChanged(false);
};
INP['font'] = el => { st.club.brand.fonts.display = el.value; cfgChanged(true); };
ACT['theme.reset'] = () => { st.club.brand = JSON.parse(JSON.stringify(CLUB0.brand)); cfgChanged(true); toast('Оформление сброшено'); };
ACT['sce.open'] = () => { ui.play.ce = { draft: JSON.parse(JSON.stringify(st.club.course)), errs: [], isNew: false, target: 'club' }; ui.settingsCE = true; window.scrollTo(0, 0); render(); };

    '<section class="card stack"><h3 class="h3">Клуб</h3>' + cfgIn('brand.name', 'Название') + '<div class="grid2">' + cfgIn('brand.short', 'Короткое название') + cfgIn('brand.tagline', 'Подзаголовок') + '</div><div class="grid2">' + cfgIn('contacts.phone', 'Телефон') + cfgIn('contacts.hours', 'Часы работы') + '</div>' + cfgIn('contacts.address', 'Адрес') + '</section>' +
    '<section class="card stack"><h3 class="h3">Оформление</h3><div class="row wrap-r" style="gap:18px"><label class="f" style="align-items:center"><span>Основной</span><input type="color" class="swatch" data-in="theme" data-k="brand" value="' + P.brand + '"></label><label class="f" style="align-items:center"><span>Акцент</span><input type="color" class="swatch" data-in="theme" data-k="gold" value="' + P.gold + '"></label><label class="f" style="align-items:center"><span>Фон</span><input type="color" class="swatch" data-in="theme" data-k="bg" value="' + P.bg + '"></label></div>' +
    field('Шрифт заголовков', '<select class="in" data-in="font">' + ['Playfair Display', 'Georgia', 'Golos Text'].map(f => '<option' + (b.fonts.display === f ? ' selected' : '') + '>' + f + '</option>').join('') + '</select>', 'Применяется сразу, тёмная тема подстраивается сама') + '<div class="hint">Всё оформление хранится в профиле клуба, а не в коде. Логику системы менять не нужно.</div><button class="btn sm" style="align-self:flex-start" data-act="theme.reset">Вернуть оформление по умолчанию</button></section>' +
    '<section class="card stack"><h3 class="h3">Разделы приложения</h3>' + Object.keys(modNames).map(k => '<label class="sw"><input type="checkbox" data-in="cfg" data-path="modules.' + k + '" data-t="b"' + (mods[k] ? ' checked' : '') + '><i></i><span>' + modNames[k] + '</span></label>').join('') + '</section>' +
    '<section class="card stack"><h3 class="h3">Продукты и цены</h3>' + st.club.products.map((p, i) => '<div class="stack" style="gap:6px"><div class="row sp"><b>' + esc(p.title) + '</b>' + (p.assumed ? badge('допущение', 'warn') : '') + '</div><div class="grid2">' + (p.kind === 'program' ? cfgIn('products.' + i + '.price', 'Цена, ₽', { t: 'n', sm: true }) + cfgIn('products.' + i + '.grants.lesson', 'Занятий', { t: 'n', sm: true }) + cfgIn('products.' + i + '.validDays', 'Дней действует', { t: 'n', sm: true }) : cfgIn('products.' + i + '.price.guest', 'Гостю, ₽', { t: 'n', sm: true }) + cfgIn('products.' + i + '.price.member', 'Члену клуба, ₽', { t: 'n', sm: true })) + '</div></div>').join('<hr class="hr">') + '</section>' +
    '<section class="card stack"><h3 class="h3">Правила записи</h3><div class="grid2">' + cfgIn('rules.horizonDays', 'Запись на дней вперёд', { t: 'n', sm: true }) + cfgIn('rules.freeCancelHours', 'Бесплатная отмена, часов', { t: 'n', sm: true }) + cfgIn('rules.maxActivePerPhone', 'Записей на номер', { t: 'n', sm: true }) + cfgIn('rules.noticeMin.course', 'Закрыть запись на поле, мин до старта', { t: 'n', sm: true }) + cfgIn('rules.noticeMin.range', 'Закрыть запись на рейндж, мин', { t: 'n', sm: true }) + cfgIn('rules.noticeMin.lesson', 'Закрыть запись на занятие, мин', { t: 'n', sm: true }) + cfgIn('resources.course.capacity', 'Игроков в слоте', { t: 'n', sm: true }) + cfgIn('resources.range.bays', 'Станций на рейндже', { t: 'n', sm: true }) + '</div><label class="sw"><input type="checkbox" data-in="cfg" data-path="rules.lateCancelBurnsUnit" data-t="b"' + (st.club.rules.lateCancelBurnsUnit ? ' checked' : '') + '><i></i><span>Позднее отменённое занятие сгорает</span></label></section>' +
    '<section class="card stack"><h3 class="h3">Прокат</h3>' + st.club.inventory.map((it, i) => '<div class="stack" style="gap:6px"><b>' + esc(it.name) + '</b><div class="grid2">' + cfgIn('inventory.' + i + '.total', 'Штук', { t: 'n', sm: true }) + cfgIn('inventory.' + i + '.price', 'Цена, ₽', { t: 'n', sm: true }) + '</div></div>').join('') + '</section>' +
    '<section class="card stack"><h3 class="h3">Тренеры</h3>' + st.club.coaches.map((c, i) => cfgIn('coaches.' + i + '.name', 'Имя тренера ' + (i + 1), { sm: true })).join('') + '<div class="hint">Часы работы тренеров правятся в профиле клуба (club.config.js). Редактор расписания добавим следующим шагом.</div></section>' +
    '<section class="card stack"><h3 class="h3">Поле клуба</h3><div class="small">' + esc(st.club.course.name) + ': ' + st.club.course.holes.length + ' лунок, пар ' + H.parOf(st.club.course) + ', меток ' + st.club.course.tees.length + (st.club.course.assumed ? '. Параметры примерные.' : '') + '</div><button class="btn sm" style="align-self:flex-start" data-act="sce.open"' + (ro ? ' disabled' : '') + '>Изменить карточку поля и рейтинг</button></section>' +
    '<section class="card stack"><h3 class="h3">АГР</h3>' + cfgIn('agr.clubCode', 'Код клуба в АГР') + '<div class="grid2">' + cfgIn('agr.allowance.stableford', 'Фора, стейблфорд (1 = 100%)', { t: 'n', sm: true }) + cfgIn('agr.allowance.stroke', 'Фора, страйк-плей', { t: 'n', sm: true }) + '</div></section>' +
    securityCard() + aboutCard() + '</div>';
}
function securityCard() {
  const kind = ui.storeKind === 'localStorage' ? 'в браузере этого устройства' : 'только в памяти вкладки (хранилище браузера недоступно)';
  return '<section class="card stack"><h3 class="h3">Безопасность и данные</h3><div class="small ink2">Вся клиентская база, записи, программы, раунды и соревнования шифруются (AES-256-GCM). Ключ защищён PIN клуба. Сейчас данные лежат ' + kind + '. На сервере клуба они лягут в базу в РФ тем же способом.</div>' +
    '<div class="grid2">' + field('Текущий PIN', '<input class="in sm" type="password" id="pin-old" autocomplete="current-password">') + field('Новый PIN (от 4 знаков)', '<input class="in sm" type="password" id="pin-new" autocomplete="new-password">') + '</div><button class="btn sm" style="align-self:flex-start" data-act="pin.change">Сменить PIN</button>' +
    '<div class="row wrap-r"><button class="btn sm" data-act="bk.export">Резервная копия (зашифрованная)</button><button class="btn sm" data-act="bk.import">Загрузить копию</button><button class="btn sm danger" data-act="bk.wipe">Стереть все данные</button></div></section>';

};
ACT['bk.export'] = () => {
  const text = store.exportBackup();
  modal('<div class="row sp"><h2 class="h2">Резервная копия</h2><button class="ico-btn" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div><div class="hint">Файл полностью зашифрован: без PIN клуба его не прочитать. Сохраните текст в надёжном месте.</div><textarea id="modal-text" class="in" rows="8" readonly data-copy>' + esc(text) + '</textarea><button class="btn primary block" data-act="copy">' + ic('copy') + 'Скопировать</button>');

ACT['bk.import'] = () => { modal('<div class="row sp"><h2 class="h2">Загрузить копию</h2><button class="ico-btn" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div><div class="errbox">Текущие данные будут заменены. После загрузки войдите с PIN из этой копии.</div><textarea id="modal-text" class="in" rows="8" placeholder="Вставьте текст копии"></textarea><button class="btn danger block" data-act="bk.import.go">Заменить данные</button>'); };

ACT['bk.wipe'] = () => { if (!confirmStep('wipe', 'Нажмите ещё раз: все данные клуба в этом браузере будут стёрты')) return; store.wipe(); ACT['lock'](); toast('Данные стёрты'); };
function aboutCard() {
  return '<section class="card flat stack"><h3 class="h3">Как устроена система</h3><div class="small ink2"><b>Профиль клуба</b> (club.config.js): название, цвета, цены, поле, тренеры, правила. Меняется без правки кода.<br><b>Ядро записи</b>: слоты, места, прокат, закрытия, напоминания. Одинаково для любого клуба.<br><b>Кошелёк</b>: программы «Три флага», сертификаты, оплаченные занятия.<br><b>Игра</b>: счёт по лункам, гандикап по WHS, статистика.<br><b>Хранилище</b>: каждая запись шифруется отдельно, версии схемы и миграции сохраняют старые данные при обновлении.<br>Клиентская база принадлежит клубу: у каждого клуба свой профиль и свой ключ.</div></section>';
}

ZN.Wallet.installHooks();
