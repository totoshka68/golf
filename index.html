    h += '<div class="grid2">' + mxIn(base + 'grants.' + u, u === 'lesson' ? 'Количество занятий' : u === 'round' ? 'Игр (девяток)' : 'Рейнджей', { t: 'n' }) + (u === 'lesson' ? mxIn(base + 'lessonMin', 'Длительность занятия, мин', { t: 'n' }) : '') + mxIn(base + 'validDays', 'Дней действует', { t: 'n' }) + '</div>';
    if (p.groupPrice) h += '<div class="hint">Цена с человека по размеру группы, ₽</div><div class="grid2">' + [1, 2, 3, 4].map(g => mxIn(base + 'groupPrice.' + (g - 1), g === 1 ? 'Один' : g === 2 ? 'Вдвоём' : g === 3 ? 'Втроём' : 'Вчетвером', { t: 'n' })).join('') + '</div>';
    else h += mxIn(base + 'price', 'Цена, ₽', { t: 'n' });
  } else if (p.kind === 'inquiry') {
    h += mxIn(base + 'price', 'Цена от, ₽', { t: 'n' }) + mxIn(base + 'note', 'Описание условий');
  } else {
    h += mxIn(base + 'price.guest', 'Цена, ₽ (одна для всех)', { t: 'n' });
  }
  h += '<div class="grid2">' + mxIn(base + 'discountPct', 'Скидка, %', { t: 'n' }) + '</div>' + mxSw(base + 'draft', 'Скрыть от клиентов') + mxSw(base + 'hit', 'Хит: всегда среди трёх на главной, пока нет своей статистики');
  if (canMatrix() && CORE_PRODUCTS.indexOf(p.id) < 0) h += '<button class="btn sm danger" style="align-self:flex-start" data-act="mx.del" data-v="' + i + '">Удалить услугу</button>';
  return h + '</div>';
}
function matrixCard() {
  const can = canMatrix(), ps = st.club.products;
  let h = '<section class="card stack"><h3 class="h3">Услуги и цены (матрица)</h3>';
  if (ui.role === 'manager') h += '<label class="sw"><input type="checkbox" data-in="mx" data-path="perms.adminEditsMatrix" data-t="b"' + (st.club.perms && st.club.perms.adminEditsMatrix ? ' checked' : '') + '><i></i><span>Разрешить администратору править матрицу</span></label>';
  if (!can) h += '<div class="note">Матрицу услуг и цен правит собственник (руководитель). Администратору право может выдать собственник.</div>';
  h += ps.map(productEditor).join('<hr class="hr">');
  if (can) h += '<div class="row wrap-r"><button class="btn sm" data-act="mx.add" data-v="program">' + ic('plus') + 'Добавить программу</button><button class="btn sm" data-act="mx.add" data-v="inquiry">' + ic('plus') + 'Добавить услугу по заявке</button></div><div class="hint">Новая услуга создаётся скрытой: заполните поля и снимите «Скрыть от клиентов». Цены статуса «предложение» держите скрытыми, пока их не утвердит собственник.</div>';
  return h + '</section>';
}
INP['mx'] = (el, kind) => {
  if (!canMatrix()) return;
  const path = el.getAttribute('data-path'), t = el.getAttribute('data-t');
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (t === 'n') { v = Number(String(v).replace(',', '.')); if (isNaN(v) || v < 0) return; }
  setPath(st.club, path, v);
  const m = /^products\.(\d+)\.(price\.guest|groupPrice\.0)$/.exec(path);
  if (m) { const p = st.club.products[Number(m[1])]; if (m[2] === 'price.guest') p.price.member = v; else p.price = v; }   // одна цена для гостя и члена клуба
  cfgChanged(el.type === 'checkbox' || (kind === 'change' && /\.title$/.test(path)));
};
ACT['mx.add'] = (el, v) => {
  if (!canMatrix()) return;
  const n = st.club.products.filter(p => /^svc-/.test(p.id)).length + 1, id = 'svc-' + n;
  st.club.products.push(v === 'inquiry'
    ? { id, kind: 'inquiry', cat: 'events', title: 'Новая услуга', tagline: '', price: 0, note: '', draft: true }
    : { id, kind: 'program', cat: 'courses', title: 'Новая программа', tagline: '', desc: '', price: 0, grants: { lesson: 1 }, lessonMin: 60, validDays: 60, draft: true });
  cfgChanged(true); toast('Услуга добавлена, она пока скрыта от клиентов');
};
ACT['mx.del'] = (el, v) => {
  if (!canMatrix()) return;
  const p = st.club.products[Number(v)]; if (!p || CORE_PRODUCTS.indexOf(p.id) >= 0) return;
  if (st.orders.some(o => o.productId === p.id) || st.entitlements.some(e => e.productId === p.id)) return toast('По услуге есть продажи. Скройте её вместо удаления');
  if (!confirmStep('mxdel' + v, 'Нажмите ещё раз, чтобы удалить «' + p.title + '»')) return;
  st.club.products.splice(Number(v), 1); cfgChanged(true);
};
function phrasesCard() {
  return '<section class="card stack"><h3 class="h3">Фразы дня на главном экране</h3><div class="hint">Одна фраза на строку. Показывается по одной в день по кругу. Сейчас фраз: ' + (st.club.phrases || []).length + '.</div><textarea class="in" rows="9" data-in="phr">' + esc((st.club.phrases || []).join('\n')) + '</textarea></section>';
}
INP['phr'] = el => { st.club.phrases = el.value.split('\n').map(x => x.trim()).filter(Boolean); st.clubEdited = true; };
ACT['sce.open18'] = () => { ui.play.ce = { draft: JSON.parse(JSON.stringify(st.club.course18)), errs: [], isNew: false, target: 'club18' }; ui.settingsCE = true; window.scrollTo(0, 0); render(); };

function sSettings() {
  if (ui.settingsCE && ui.play.ce) return courseEditor(ui.play.ce, 'sce.close');
  const b = st.club.brand, P = b.palette.light, mods = st.club.modules, ro = ui.role !== 'admin';
  const modNames = { booking: 'Запись', certificates: 'Сертификаты', events: 'Соревнования', play: 'Игра со счётом', stats: 'Статистика', agr: 'АГР' };
  const assumed = [];
  st.club.products.forEach(p => { if (p.assumed) assumed.push('Цена или состав: ' + p.title); });
  if (st.club.course.assumed) assumed.push('Пар, индексы и рейтинг меток поля');
  st.club.inventory.forEach(i => { if (i.assumed) assumed.push('Прокат: ' + i.name); });
  st.club.coaches.forEach(c => { if (c.assumed) assumed.push('Тренер: имя и часы'); });
  return '<div class="stack"><h2 class="h2">Настройки клуба</h2>' + (ui.setMsg ? '<div class="okbox">' + esc(ui.setMsg) + '</div>' : '') +
    (assumed.length ? '<div class="note"><b>Значения-допущения, замените реальными:</b><br>' + assumed.filter((x, i, a) => a.indexOf(x) === i).map(esc).join('<br>') + '</div>' : '') +
    '<section class="card stack"><h3 class="h3">Клуб</h3>' + cfgIn('brand.name', 'Название') + '<div class="grid2">' + cfgIn('brand.short', 'Короткое название') + cfgIn('brand.tagline', 'Подзаголовок') + '</div><div class="grid2">' + cfgIn('contacts.phone', 'Телефон') + cfgIn('contacts.hours', 'Часы работы') + '</div>' + cfgIn('contacts.address', 'Адрес') + '</section>' +
    '<section class="card stack"><h3 class="h3">Оформление</h3><div class="row wrap-r" style="gap:18px"><label class="f" style="align-items:center"><span>Основной</span><input type="color" class="swatch" data-in="theme" data-k="brand" value="' + P.brand + '"></label><label class="f" style="align-items:center"><span>Акцент</span><input type="color" class="swatch" data-in="theme" data-k="gold" value="' + P.gold + '"></label><label class="f" style="align-items:center"><span>Фон</span><input type="color" class="swatch" data-in="theme" data-k="bg" value="' + P.bg + '"></label></div>' +
    field('Шрифт заголовков', '<select class="in" data-in="font">' + ['Playfair Display', 'Georgia', 'Golos Text'].map(f => '<option' + (b.fonts.display === f ? ' selected' : '') + '>' + f + '</option>').join('') + '</select>', 'Применяется сразу, тёмная тема подстраивается сама') + '<div class="hint">Всё оформление хранится в профиле клуба, а не в коде. Логику системы менять не нужно.</div><button class="btn sm" style="align-self:flex-start" data-act="theme.reset">Вернуть оформление по умолчанию</button></section>' +
    '<section class="card stack"><h3 class="h3">Разделы приложения</h3>' + Object.keys(modNames).map(k => '<label class="sw"><input type="checkbox" data-in="cfg" data-path="modules.' + k + '" data-t="b"' + (mods[k] ? ' checked' : '') + '><i></i><span>' + modNames[k] + '</span></label>').join('') + '</section>' +
    matrixCard() + phrasesCard() +
    '<section class="card stack"><h3 class="h3">Правила записи</h3><div class="grid2">' + cfgIn('rules.horizonDays', 'Запись на дней вперёд', { t: 'n', sm: true }) + cfgIn('rules.freeCancelHours', 'Бесплатная отмена, часов', { t: 'n', sm: true }) + cfgIn('rules.maxActivePerPhone', 'Записей на номер', { t: 'n', sm: true }) + cfgIn('rules.noticeMin.course', 'Закрыть запись на поле, мин до старта', { t: 'n', sm: true }) + cfgIn('rules.noticeMin.range', 'Закрыть запись на рейндж, мин', { t: 'n', sm: true }) + cfgIn('rules.noticeMin.lesson', 'Закрыть запись на занятие, мин', { t: 'n', sm: true }) + cfgIn('resources.course.capacity', 'Игроков в слоте', { t: 'n', sm: true }) + cfgIn('resources.range.bays', 'Станций на рейндже', { t: 'n', sm: true }) + '</div><label class="sw"><input type="checkbox" data-in="cfg" data-path="rules.lateCancelBurnsUnit" data-t="b"' + (st.club.rules.lateCancelBurnsUnit ? ' checked' : '') + '><i></i><span>Позднее отменённое занятие сгорает</span></label></section>' +
    '<section class="card stack"><h3 class="h3">Прокат</h3>' + st.club.inventory.map((it, i) => '<div class="stack" style="gap:6px"><b>' + esc(it.name) + '</b><div class="grid2">' + cfgIn('inventory.' + i + '.total', 'Штук', { t: 'n', sm: true }) + cfgIn('inventory.' + i + '.price', 'Цена, ₽', { t: 'n', sm: true }) + '</div></div>').join('') + '</section>' +
    '<section class="card stack"><h3 class="h3">Тренеры</h3>' + st.club.coaches.map((c, i) => cfgIn('coaches.' + i + '.name', 'Имя тренера ' + (i + 1), { sm: true })).join('') + '<div class="hint">Часы работы тренеров правятся в профиле клуба (club.config.js). Редактор расписания добавим следующим шагом.</div></section>' +
    '<section class="card stack"><h3 class="h3">Поле клуба</h3><div class="small">' + esc(st.club.course.name) + ': ' + st.club.course.holes.length + ' лунок, пар ' + H.parOf(st.club.course) + ', меток ' + st.club.course.tees.length + (st.club.course.assumed ? '. Параметры примерные.' : '') + '</div><button class="btn sm" style="align-self:flex-start" data-act="sce.open"' + (ro ? ' disabled' : '') + '>Изменить карточку поля и рейтинг</button>' + (st.club.course18 ? '<div class="small" style="margin-top:6px">' + esc(st.club.course18.name) + (st.club.course18.assumed ? '. Параметры примерные (ДОПУЩЕНИЕ).' : '') + '</div><button class="btn sm" style="align-self:flex-start" data-act="sce.open18"' + (ro ? ' disabled' : '') + '>Изменить поле на 18 лунок</button>' : '') + '</section>' +
    '<section class="card stack"><h3 class="h3">АГР</h3>' + cfgIn('agr.clubCode', 'Код клуба в АГР') + '<div class="grid2">' + cfgIn('agr.allowance.stableford', 'Фора, стейблфорд (1 = 100%)', { t: 'n', sm: true }) + cfgIn('agr.allowance.stroke', 'Фора, страйк-плей', { t: 'n', sm: true }) + '</div></section>' +
    securityCard() + aboutCard() + '</div>';
}
function securityCard() {
  const kind = ui.storeKind === 'localStorage' ? 'в браузере этого устройства' : 'только в памяти вкладки (хранилище браузера недоступно)';
  return '<section class="card stack"><h3 class="h3">Безопасность и данные</h3><div class="small ink2">Вся клиентская база, записи, программы, раунды и соревнования шифруются (AES-256-GCM). Ключ защищён PIN клуба. Сейчас данные лежат ' + kind + '. На сервере клуба они лягут в базу в РФ тем же способом.</div>' +
    '<div class="grid2">' + field('Текущий PIN', '<input class="in sm" type="password" id="pin-old" autocomplete="current-password">') + field('Новый PIN (от 4 знаков)', '<input class="in sm" type="password" id="pin-new" autocomplete="new-password">') + '</div><button class="btn sm" style="align-self:flex-start" data-act="pin.change">Сменить PIN</button>' +
    '<div class="row wrap-r"><button class="btn sm" data-act="bk.export">Резервная копия (зашифрованная)</button><button class="btn sm" data-act="bk.import">Загрузить копию</button><button class="btn sm danger" data-act="bk.wipe">Стереть все данные</button></div></section>';
}
ACT['pin.change'] = async () => {
  try { await store.changePin(($('#pin-old') || {}).value || '', ($('#pin-new') || {}).value || ''); ui.setMsg = 'PIN изменён. Данные остались прежними.'; toast('PIN изменён'); } catch (e) { toast(e.code === 'bad_pin' ? 'Текущий PIN неверный' : e.message); }
  render();
};
ACT['bk.export'] = () => {
  const text = store.exportBackup();
  modal('<div class="row sp"><h2 class="h2">Резервная копия</h2><button class="ico-btn" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div><div class="hint">Файл полностью зашифрован: без PIN клуба его не прочитать. Сохраните текст в надёжном месте.</div><textarea id="modal-text" class="in" rows="8" readonly data-copy>' + esc(text) + '</textarea><button class="btn primary block" data-act="copy">' + ic('copy') + 'Скопировать</button>');
};
ACT['bk.import'] = () => { modal('<div class="row sp"><h2 class="h2">Загрузить копию</h2><button class="ico-btn" data-act="close" aria-label="Закрыть">' + ic('x') + '</button></div><div class="errbox">Текущие данные будут заменены. После загрузки войдите с PIN из этой копии.</div><textarea id="modal-text" class="in" rows="8" placeholder="Вставьте текст копии"></textarea><button class="btn danger block" data-act="bk.import.go">Заменить данные</button>'); };
ACT['bk.import.go'] = () => { try { store.importBackup(($('#modal-text') || {}).value || ''); closeModal(); ACT['lock'](); toast('Копия загружена. Введите PIN'); } catch (e) { toast(e.message); } };
ACT['bk.wipe'] = () => { if (!confirmStep('wipe', 'Нажмите ещё раз: все данные клуба в этом браузере будут стёрты')) return; store.wipe(); ACT['lock'](); toast('Данные стёрты'); };
function aboutCard() {
  return '<section class="card flat stack"><h3 class="h3">Как устроена система</h3><div class="small ink2"><b>Профиль клуба</b> (club.config.js): название, цвета, цены, поле, тренеры, правила. Меняется без правки кода.<br><b>Ядро записи</b>: слоты, места, прокат, закрытия, напоминания. Одинаково для любого клуба.<br><b>Кошелёк</b>: программы «Три флага», сертификаты, оплаченные занятия.<br><b>Игра</b>: счёт по лункам, гандикап по WHS, статистика.<br><b>Хранилище</b>: каждая запись шифруется отдельно, версии схемы и миграции сохраняют старые данные при обновлении.<br>Клиентская база принадлежит клубу: у каждого клуба свой профиль и свой ключ.</div></section>';
}

ZN.Wallet.installHooks();
bootApp();
})();
</script>
