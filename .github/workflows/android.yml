name: Сборка Android
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Создаём проект Android из страницы
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ ! -d android ]; then npx cap add android; fi
          pip install pillow
          python3 prepare_android.py
          npx cap sync android
      - name: Пробная сборка для проверки на своём телефоне
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: znamenskoye-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Подписанная сборка для RuStore (только если добавлены секреты)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: znamenskoye-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
